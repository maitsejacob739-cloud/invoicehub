name: invoicehub

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: invoicehub
      POSTGRES_PASSWORD: invoicehub-dev
      POSTGRES_DB: invoicehub
    volumes:
      - invoicehub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicehub -d invoicehub"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    labels:
      base44.project: "InvoiceHub"
      base44.kind: "infra"

  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /srv
    command:
      - sh
      - -ec
      - pip install --no-cache-dir --quiet -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload
    volumes:
      - ./:/srv
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql+psycopg://invoicehub:invoicehub-dev@db:5432/invoicehub
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    labels:
      base44.project: "InvoiceHub"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  invoicehub-db:
