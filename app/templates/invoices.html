{% extends "base.html" %}
{% block title %}Invoices · InvoiceHub{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Invoices</h1>
  <a class="btn primary" href="/invoices/new">New invoice</a>
</div>
<div class="filters">
  <a class="btn small {{ 'primary' if not status else 'ghost' }}" href="/invoices">All</a>
  {% for s in ['draft', 'sent', 'paid'] %}
  <a class="btn small {{ 'primary' if status == s else 'ghost' }}" href="/invoices?status={{ s }}">{{ s|capitalize }}</a>
  {% endfor %}
</div>
<section class="card">
  {% include "invoices_table.html" %}
</section>
{% endblock %}
