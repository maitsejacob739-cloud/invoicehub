<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InvoiceHub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Invoice<span>Hub</span></a>
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
    <a href="/clients" class="{{ 'active' if request.url.path.startswith('/clients') else '' }}">Clients</a>
    <a href="/invoices" class="{{ 'active' if request.url.path.startswith('/invoices') else '' }}">Invoices</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
