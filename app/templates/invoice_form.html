{% extends "base.html" %}
{% block title %}New invoice · InvoiceHub{% endblock %}
{% block content %}
<h1>New invoice</h1>
<form class="card" method="post" action="/invoices">
  <div class="form-grid">
    <label>Invoice number <input name="number" value="{{ next_number }}" required></label>
    <label>Client
      <select name="client_id" required>
        {% for c in clients %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
    </label>
    <label>Issue date <input type="date" name="issue_date" value="{{ today }}"></label>
    <label>Due date <input type="date" name="due_date"></label>
  </div>
  <label>Notes <textarea name="notes" rows="2" placeholder="Payment terms, thank-you note…"></textarea></label>
  <h2>Line items</h2>
  <div id="items">
    <div class="item-row">
      <input name="description" placeholder="Description" required>
      <input name="quantity" type="number" step="0.01" min="0" value="1">
      <input name="unit_price" type="number" step="0.01" min="0" value="0">
      <button type="button" class="remove-item" aria-label="Remove line">✕</button>
    </div>
  </div>
  <button type="button" id="add-item" class="btn ghost">+ Add line</button>
  <div class="form-actions">
    <button class="btn primary" type="submit">Create invoice</button>
    <a class="btn" href="/invoices">Cancel</a>
  </div>
</form>
<script src="/static/app.js"></script>
{% endblock %}
